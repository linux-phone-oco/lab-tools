[package]
name = "lpoco-layer"
# the family is released together: one version with lpoco and every lpoco-* program (release-plz.toml, version_group)
version = "0.29.1"
edition = "2021"
description = "lpoco layer: a phone's device layer, declared once in device.toml [layer], packed into apk, deb, rpm and archlinux packages through nfpm"
license = "MIT OR Apache-2.0"

[lib]
name = "lpoco_layer"

[dependencies]
lpoco-manifest = { path = "../manifest" }
# the command line is declared once (argenv), not parsed by hand
argenv-resolve = "0.4"
serde = { version = "1", features = ["derive"] }

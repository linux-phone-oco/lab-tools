[workspace]
dependencies_update = false
# delivered as Alpine packages (packaging/conveyor.toml), not through crates.io
publish = false
git_only = true
git_tag_enable = true
git_release_enable = false
# release-plz counts every commit since a tag as a change, its own 'chore: release' commit too, and
# would open the next release PR for ever. Only these kinds release; chore (release commits among
# them) does not, except chore(deps): a dependency bump (rhizoid moves a pin so) releases the crate it moves. Proof: release_plz_ignores_its_own_release_commits.
release_commits = '^((feat|fix|perf|refactor|docs|test|build|ci)(\([^)]*\))?|chore\(deps\))!?:'

# the lpoco family is released together: one version for the dispatcher and every lpoco-* program (except lpoco-manifest and lpoco-attended, below)
# (version_group), so `lpoco NAME` can refuse a program of another version. Tags stay per package:
# the conveyor reads lpoco-health-v* for the phone package; the dispatcher is lab-side only.
# every member lists the others in changelog_include: a package changed only by the family bump gets
# no changelog entry otherwise, and main is red between two release PRs (proof:
# release-pr-writes-every-changelog, lpoco/tests/release_family.rs).
# Each also lists osfact: release-plz bumps a version_group member only for a commit of its own or of a package it
# includes, so a release that reached the family only through osfact -> lpoco-manifest -> its dependents left
# lpoco, lpoco-health, lpoco-tone and lpoco-ffs-acm behind (release #499; proof: a_release_moves_lpoco_manifest_only_when_manifest_changed)
[[package]]
name = "lpoco"
changelog_include = ["lpoco-health", "lpoco-bringup", "lpoco-lab", "lpoco-tone", "lpoco-host", "lpoco-manifest", "lpoco-ffs-acm", "lpoco-layer", "osfact"]
version_group = "lpoco"
git_tag_name = "lpoco-v{{ version }}"
git_release_enable = true

[[package]]
name = "lpoco-health"
changelog_include = ["lpoco", "lpoco-bringup", "lpoco-lab", "lpoco-tone", "lpoco-host", "lpoco-manifest", "lpoco-ffs-acm", "lpoco-layer", "osfact"]
version_group = "lpoco"
# the conveyor reads this prefix (packaging/conveyor.toml)
git_tag_name = "lpoco-health-v{{ version }}"
git_release_enable = true

[[package]]
name = "lpoco-bringup"
changelog_include = ["lpoco", "lpoco-health", "lpoco-lab", "lpoco-tone", "lpoco-host", "lpoco-manifest", "lpoco-ffs-acm", "lpoco-layer", "osfact"]
version_group = "lpoco"
git_tag_name = "lpoco-bringup-v{{ version }}"
git_release_enable = true

# lpoco-lab (also devlab) and lpoco-tone (also tone) join the family: one version, tags per package
[[package]]
name = "lpoco-lab"
changelog_include = ["lpoco", "lpoco-health", "lpoco-bringup", "lpoco-tone", "lpoco-host", "lpoco-manifest", "lpoco-ffs-acm", "lpoco-layer", "osfact"]
version_group = "lpoco"
git_tag_name = "lpoco-lab-v{{ version }}"
git_release_enable = true

[[package]]
name = "lpoco-tone"
changelog_include = ["lpoco", "lpoco-health", "lpoco-bringup", "lpoco-lab", "lpoco-host", "lpoco-manifest", "lpoco-ffs-acm", "lpoco-layer", "osfact"]
version_group = "lpoco"
git_tag_name = "lpoco-tone-v{{ version }}"
git_release_enable = true

# lpoco-host prepares the lab host (udev access, modules, the host's tools at pins)
[[package]]
name = "lpoco-host"
changelog_include = ["lpoco", "lpoco-health", "lpoco-bringup", "lpoco-lab", "lpoco-tone", "lpoco-manifest", "lpoco-ffs-acm", "lpoco-layer", "osfact"]
version_group = "lpoco"
git_tag_name = "lpoco-host-v{{ version }}"
git_release_enable = true

# lpoco-manifest declares device.toml once: the types every lpoco program reads, its JSON Schema projected.
# Not in the family: no version_group, so it is tagged only when manifest/ changes and lpoco-attended's pin of
# it can have an edge. A manifest change still moves its path dependents, and version_group keeps those in
# step, so `lpoco NAME` never sees mixed versions (proof: a_release_moves_lpoco_manifest_only_when_manifest_changed).
[[package]]
name = "lpoco-manifest"
changelog_include = []
git_tag_name = "lpoco-manifest-v{{ version }}"
git_release_enable = true

# lpoco-ffs-acm: the FunctionFS serial console a phone's init can run (moved from google-walleye-lab)
[[package]]
name = "lpoco-ffs-acm"
changelog_include = ["lpoco", "lpoco-health", "lpoco-bringup", "lpoco-lab", "lpoco-tone", "lpoco-host", "lpoco-manifest", "lpoco-layer", "osfact"]
version_group = "lpoco"
git_tag_name = "lpoco-ffs-acm-v{{ version }}"
git_release_enable = false

# lpoco-layer packs a phone's device layer ([layer] in device.toml) into apk, deb, rpm and archlinux packages
[[package]]
name = "lpoco-layer"
changelog_include = ["lpoco", "lpoco-health", "lpoco-bringup", "lpoco-lab", "lpoco-tone", "lpoco-host", "lpoco-manifest", "lpoco-ffs-acm", "osfact"]
version_group = "lpoco"
git_tag_name = "lpoco-layer-v{{ version }}"
git_release_enable = true

# lpoco-attended: a lane's attended procedure as a list of named steps (used from a rust-script by git tag).
# Not in the family: no version_group, so it is tagged only when its own files change and the labs' pin
# moves for a real change only (proof: a_release_moves_lpoco_attended_only_when_attended_changed).
# release-plz bumps a package whose path dependency is released and has no setting against it
# (https://release-plz.dev/docs/config), so attended names lpoco-manifest by its released git tag, not by
# path (decision 2026-11-23-lpoco-attended-leaves-the-family-its-own-version).
# `lpoco attended` is checked against its own version (lpoco/src/main.rs, OWN_VERSION).
[[package]]
name = "lpoco-attended"
changelog_include = []
git_tag_name = "lpoco-attended-v{{ version }}"
git_release_enable = true

# osfact (os-factory): a device's installable image from its declaration, a distro profile and the proven parts -
# depends on no lpoco crate, extractable to its own repository (decision 2026-11-27-osfact-own-rust-in-lab-tools).
# Not in the family: its own version and its own tag prefix, osfact-v*. Released since its walking skeleton's build landed
# (decision 2026-11-28-osfact-is-first-released-with-the-walking-skeleton-s): its x86_64 binary and sha256 are attached
# to the osfact-vX.Y.Z release by .github/workflows/assets.yml (proof: lpoco/tests/release_osfact.rs).
[[package]]
name = "osfact"
changelog_include = []
git_tag_name = "osfact-v{{ version }}"
git_release_enable = true

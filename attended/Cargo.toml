[package]
name = "lpoco-attended"
# the family is released together: one version with lpoco and every lpoco-* program (release-plz.toml, version_group)
version = "0.31.1"
edition = "2021"
description = "lpoco attended: a lane's attended procedure as a plain list of named steps that each stop the run, with --dry-run and a log"
license = "MIT OR Apache-2.0"

[lib]
name = "lpoco_attended"

[dependencies]
# the command line is declared once (argenv), not parsed by hand
argenv-resolve = "0.4"
# the device manifest a procedure names: its values are read from the same declared tables every lpoco program reads
lpoco-manifest = { path = "../manifest" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# the front door of a device repo's procedures: `lpoco attended new|run|check`
[[bin]]
name = "lpoco-attended"
path = "src/bin/lpoco-attended/main.rs"


[package]
name = "lpoco-attended"
# released on its own: tagged only when this library changes (release-plz.toml has it outside version_group lpoco)
version = "0.46.15"
edition = "2021"
description = "lpoco attended: a lane's attended procedure as a plain list of named steps that each stop the run, with --dry-run and a log"
license = "MIT OR Apache-2.0"

[lib]
name = "lpoco_attended"

[dependencies]
# the command line is declared once (argenv), not parsed by hand
argenv-resolve = "0.4"
# the device manifest a procedure names, at its released tag and not by path: a path dependency would move this
# library at every family release (release-plz.toml). `rhizoid bump` moves the tag, when attended needs a newer manifest.
# the values it reads are the same declared tables every lpoco program reads
lpoco-manifest = { git = "https://github.com/linux-phone-oco/lab-tools", tag = "lpoco-manifest-v0.56.8" }
# a signal ends the run through its way backs: the handler only sets a flag the run reads between its calls
signal-hook = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# the checksum an image is declared with is checked before it is booted
sha2 = "0.11"
toml = "0.8"

# the front door of a device repo's procedures: `lpoco attended new|run|check`
[[bin]]
name = "lpoco-attended"
path = "src/bin/lpoco-attended/main.rs"


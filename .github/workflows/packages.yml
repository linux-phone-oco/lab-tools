name: Packages

# A signed Alpine repository on GitHub Pages - lpoco-health for postmarketOS phones -
# rebuilt after every lpoco-health release (or by hand), so a
# phone's apk upgrade brings it with the rest of its system. Building, signing, checking,
# publishing and a real install live in the package conveyor; this repository keeps its declarations
# (packaging/conveyor.toml), its APKBUILDs and its public key.
# The private key is the secret APK_SIGNING_KEY, given to the one conveyor step that signs.
# Tags: lpoco-health-v* are release-plz's (release-plz.toml). The sxmo-utils-v* tags stay, unused; sxmo-utils is
# Alpine community's now.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (default - the newest lpoco-health-v tag)
        required: false

permissions:
  contents: read

concurrency:
  group: packages
  cancel-in-progress: false

jobs:
  tag:
    name: which release?
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      health: ${{ steps.tag.outputs.health }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: tag
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git fetch --tags --force
          newest() { git tag --list "$1" --sort=-v:refname | head -n1; }
          health=""
          case "$EVENT" in
            push) given="$REF_NAME" ;;
            workflow_dispatch) given="$INPUT_TAG" ;;
            *) given=""; health="$(git tag --points-at "$HEAD_SHA" | grep -E '^lpoco-health-v[0-9]' | head -n1 || true)" ;;
          esac
          case "$given" in
            lpoco-health-v*) health="$given" ;;
            "") if [ "$EVENT" = workflow_dispatch ]; then health="$(newest 'lpoco-health-v*')"; fi ;;
            *) echo "a tag that is not an lpoco-health-v: $given" >&2; exit 1 ;;
          esac
          echo "health=$health" >> "$GITHUB_OUTPUT"
          echo "release tags: lpoco-health ${health:-none}"
  alpine:
    name: the package conveyor - lpoco-health
    needs: tag
    if: needs.tag.outputs.health != ''
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: linux-package-distribution-oco/conveyor/.github/workflows/alpine.yml@v1
    with:
      tag: ${{ needs.tag.outputs.health }}
    secrets:
      APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}

name: Packages

# A signed Alpine repository on GitHub Pages - lpoco-health and sxmo-utils for postmarketOS phones -
# rebuilt after every lpoco-health release, or when an sxmo-utils-v tag is pushed (or by hand), so a
# phone's apk upgrade brings both with the rest of its system. Building, signing, checking,
# publishing and a real install live in the package conveyor; this repository keeps its declarations
# (packaging/conveyor.toml, packaging/sxmo-utils/conveyor.toml), its APKBUILDs and its public key.
# The private key is the secret APK_SIGNING_KEY, given to the one conveyor step that signs. Both packages
# are one repository, so their jobs run one after the other: each keeps what the other published.
# Tags: lpoco-health-v* are release-plz's (release-plz.toml); sxmo-utils-v* are made by hand, once per
# lab tag of grenudi/sxmo-utils, and equal the APKBUILD's pkgver.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  push:
    tags: ['sxmo-utils-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (default - the newest lpoco-health-v and sxmo-utils-v tags, both)
        required: false

permissions:
  contents: read

concurrency:
  group: packages
  cancel-in-progress: false

jobs:
  tag:
    name: which release?
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      health: ${{ steps.tag.outputs.health }}
      shell: ${{ steps.tag.outputs.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: tag
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git fetch --tags --force
          newest() { git tag --list "$1" --sort=-v:refname | head -n1; }
          health=""; shell=""
          case "$EVENT" in
            push) given="$REF_NAME" ;;
            workflow_dispatch) given="$INPUT_TAG" ;;
            *) given=""; health="$(git tag --points-at "$HEAD_SHA" | grep -E '^lpoco-health-v[0-9]' | head -n1 || true)" ;;
          esac
          case "$given" in
            lpoco-health-v*) health="$given" ;;
            sxmo-utils-v*) shell="$given" ;;
            "") if [ "$EVENT" = workflow_dispatch ]; then health="$(newest 'lpoco-health-v*')"; shell="$(newest 'sxmo-utils-v*')"; fi ;;
            *) echo "a tag that is neither lpoco-health-v nor sxmo-utils-v: $given" >&2; exit 1 ;;
          esac
          echo "health=$health" >> "$GITHUB_OUTPUT"
          echo "shell=$shell" >> "$GITHUB_OUTPUT"
          echo "release tags: lpoco-health ${health:-none}, sxmo-utils ${shell:-none}"
  alpine:
    name: the package conveyor - lpoco-health
    needs: tag
    if: needs.tag.outputs.health != ''
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: linux-package-distribution-oco/conveyor/.github/workflows/alpine.yml@v1
    with:
      tag: ${{ needs.tag.outputs.health }}
    secrets:
      APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
  alpine-sxmo-utils:
    name: the package conveyor - sxmo-utils
    # after lpoco-health's job (the pages are one repository), whether or not that job ran
    needs: [tag, alpine]
    if: ${{ !cancelled() && needs.alpine.result != 'failure' && needs.tag.outputs.shell != '' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: linux-package-distribution-oco/conveyor/.github/workflows/alpine.yml@v1
    with:
      tag: ${{ needs.tag.outputs.shell }}
      declaration: packaging/sxmo-utils/conveyor.toml
    secrets:
      APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}

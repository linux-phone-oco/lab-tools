name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    name: build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # bringup's rust-script example test (tests/rust_script_step.rs) runs the script
      - uses: taiki-e/install-action@v2
        with:
          tool: rust-script
      # the release test runs release-plz on a fixture workspace (lpoco/tests/release_family.rs)
      - uses: taiki-e/install-action@v2
        with:
          tool: release-plz@0.4.3
      # every lab apk names its licence, url, origin and a public source (AGPL-3.0 6(d))
      - run: .github/check-apk-origin.sh
      - run: .github/test-check-apk-origin.sh
      # every tracked file is under a licence (a header or REUSE.toml) and every licence named has its text;
      # ideal-agent's scripts/licence-check, copied as it is (grenudi/ideal-agent#101)
      - run: sh .github/licence-check
      # the helpers that run on a phone build for its architecture: lpoco-ffs-acm, static (the aarch64 GCC links it,
      # as on the lab, health/build.sh); proof: lpoco/tests/ci_cross.rs
      - run: |
          rustup target add aarch64-unknown-linux-musl
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc cargo build --release --locked -p lpoco-ffs-acm --target aarch64-unknown-linux-musl
      - run: cargo test --workspace

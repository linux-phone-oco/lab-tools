name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    name: build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # bringup's rust-script example test (tests/rust_script_step.rs) runs the script
      - uses: taiki-e/install-action@v2
        with:
          tool: rust-script
      # the release test runs release-plz on a fixture workspace (lpoco/tests/release_family.rs)
      - uses: taiki-e/install-action@v2
        with:
          tool: release-plz@0.4.3
      # the sxmo-utils lab apk (packaging/sxmo-utils): its declaration and what its source tag carries
      - run: .github/check-sxmo-utils-apk.sh
      - run: cargo test --workspace

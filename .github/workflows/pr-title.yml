name: commit-kind

# release-plz bumps the version only for conventional commits. `land` squash-merges a one-commit
# branch under its commit's title, so every commit of a pull request must name its kind (the pattern
# is .github/commit-kind.regex, read by lpoco/tests/release_family.rs too). Otherwise code lands that
# no release carries and release-plz opens a changelog-only release (release-tags-every-change).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  kind:
    name: commits and title name their kind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          check() {
            if printf '%s' "$1" | grep -Eq -f .github/commit-kind.regex; then echo "ok: $1"
            else echo "must start with feat|fix|docs|chore|refactor|perf|test|ci|build then ': ' - got: $1"; bad=1; fi
          }
          check "$TITLE"
          while IFS= read -r subject; do check "$subject"; done < <(git log --no-merges --format=%s "$BASE..$HEAD")
          if [ "$bad" = 1 ]; then exit 1; fi
      # a changelog never changes without a version, unless the change completes a version the package
      # already carries (#113 after #111): the rule is .github/check-changelog.sh, tested by
      # lpoco/tests/changelog_check.rs
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: sh .github/check-changelog.sh "$BASE" "$HEAD"

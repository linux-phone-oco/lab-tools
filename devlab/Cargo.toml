[package]
name = "lpoco-lab"
# the family is released together: one version (release-plz.toml, version_group)
version = "0.48.7"
edition = "2021"
description = "The device lab for Linux phones: reach a phone, try a kernel, test - for any device, from its manifest"
license = "MIT OR Apache-2.0"

[dependencies]
ideal-agent = { git = "https://github.com/grenudi/ideal-agent", rev = "5967ea8101f9b502ec2c2dd3bf47b64a5ba90c8d" }
hound = "3"
tone = { package = "lpoco-tone", path = "../tone" }
lpoco-host = { path = "../host" }
anyhow = "1"
argenv-resolve = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
lpoco-manifest = { path = "../manifest" }
rmcp = { version = "3.10", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["rt", "io-std"] }

# one program, two names: `lpoco lab` runs lpoco-lab; devlab stays as the name it had
[[bin]]
name = "lpoco-lab"
path = "src/main.rs"

[[bin]]
name = "devlab"
path = "src/main.rs"

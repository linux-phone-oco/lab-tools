[package]
name = "lpoco"
# the family is released together: lpoco and every lpoco-* program share one version (release-plz.toml, version_group)
version = "0.22.1"
edition = "2021"
description = "lpoco: one front door for the linux-phone-oco tools - `lpoco NAME args` runs `lpoco-NAME`"
license = "MIT OR Apache-2.0"

[dependencies]
argenv-resolve = "0.4"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
regex = "1.13.2"
serde_json = "1"

[package]
name = "tone"
version = "0.1.0"
edition = "2021"
description = "Make a test tone, and find it in a recording - so a device's speaker can test its microphone"
license = "MIT OR Apache-2.0"

[features]
default = ["cli"]
# reading and writing recordings: WAV (by hound) and raw s16le - all a phone's runner needs
wav = ["dep:hound"]
# the lab's own command, tone make|find
cli = ["wav", "dep:anyhow", "dep:clap", "dep:serde_json"]

[[bin]]
name = "tone"
required-features = ["cli"]

[dependencies]
anyhow = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
hound = { version = "3", optional = true }
serde_json = { version = "1", optional = true }

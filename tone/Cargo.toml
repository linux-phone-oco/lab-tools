[package]
name = "lpoco-tone"
# the family is released together: one version (release-plz.toml, version_group)
version = "0.47.1"
edition = "2021"
description = "Make a test tone, and find it in a recording - so a device's speaker can test its microphone"
license = "MIT OR Apache-2.0"

[features]
default = ["cli"]
# reading and writing recordings: WAV (by hound) and raw s16le - all a phone's runner needs
wav = ["dep:hound"]
# the lab's own command, tone make|find
cli = ["wav", "dep:anyhow", "dep:argenv-resolve", "dep:serde", "dep:serde_json"]

[lib]
name = "tone"

# one program, two names: `lpoco tone` runs lpoco-tone; tone stays as the name it had
[[bin]]
name = "lpoco-tone"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "tone"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = { version = "1", optional = true }
argenv-resolve = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
hound = { version = "3", optional = true }
serde_json = { version = "1", optional = true }

# How lab-tools is delivered: read by the package conveyor
# (https://github.com/linux-package-distribution-oco/conveyor). The APKBUILD and the public key stay
# here; building, signing, checking and publishing live in the conveyor, once.
[package]
name = "lpoco-health"
tag-prefix = "lpoco-health-v"

[alpine]
apkbuild = "packaging/alpine/APKBUILD"
key = "packaging/alpine/linux-phone-oco-lab-tools-20261117.rsa.pub"
release = "3.24"        # postmarketOS v26.06, as surya runs it
repo = "lab-tools"
archs = ["aarch64"]
retire = ["sxmo-utils"]   # no longer built or published (lab-tools #214): the conveyor drops it from the pages, once

[site]
title = "lab-tools packages"

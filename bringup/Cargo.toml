[package]
name = "lpoco-bringup"
# the family is released together: one version with lpoco and every lpoco-* program (release-plz.toml, version_group)
version = "0.28.2"
edition = "2021"
description = "lpoco bringup: the host side of bringing a phone up - boot images made, read and checked against the device's manifest"
license = "MIT OR Apache-2.0"

[lib]
name = "lpoco_bringup"

[dependencies]
# the header layer: parse and write the Android boot image header (v0 proven byte for byte against mkbootimg,
# tests/pack_v0.rs; research bringup-image-v0-oxide-writes-v0)
abootimg-oxide = "0.5"
sha1 = "0.10"
toml = "0.8"
lpoco-manifest = { path = "../manifest" }
serde = { version = "1", features = ["derive"] }
# the command line is declared once (argenv), not parsed by hand
argenv-resolve = "0.4"
flate2 = "1"
xz2 = "0.1"

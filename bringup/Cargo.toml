[package]
name = "lpoco-bringup"
# the family is released together: one version with lpoco and every lpoco-* program (release-plz.toml, version_group)
version = "0.54.4"
edition = "2021"
description = "lpoco bringup: the host side of bringing a phone up - boot images made, read and checked against the device's manifest"
license = "MIT OR Apache-2.0"

[lib]
name = "lpoco_bringup"

[dependencies]
# the header layer of the images osfact reads and writes (bringup keeps it for `image swap`, swap.rs)
abootimg-oxide = "0.5"
toml = "0.8"
lpoco-manifest = { path = "../manifest" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the command line is declared once (argenv), not parsed by hand
argenv-resolve = "0.4"
# the os-words rule of the boot header is osfact's (one place); osfact depends on no lpoco crate
osfact = { path = "../osfact" }
flate2 = "1"
xz2 = "0.1"
sha2 = "0.11"

[package]
name = "lpoco-health"
version = "0.36.0"
edition = "2021"
description = "The phone's health, measured on the phone: one suite that runs scheduled tests, gathers their results, and switches tests on or off with a reason"
license = "MIT OR Apache-2.0"

[dependencies]
serde_json = "1"
# the command line is declared once (argenv), not parsed by hand
argenv-resolve = "0.4"
serde = { version = "1", features = ["derive"] }
# the lab's tone crate, its analysis and WAV/raw reading only (no command-line parser of its own)
tone = { package = "lpoco-tone", path = "../tone", default-features = false, features = ["wav"] }

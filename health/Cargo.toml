[package]
name = "devlab-health"
version = "0.1.1"
edition = "2021"
description = "The phone's health, measured on the phone after every boot: one report per run, evidence kept when unhealthy"
license = "MIT OR Apache-2.0"

[dependencies]
serde_json = "1"
# the lab's tone crate, its analysis and WAV/raw reading only (no command-line parser of its own)
tone = { path = "../tone", default-features = false, features = ["wav"] }
